[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "private-set-intersection-psi"
version = "2.0.0"
description = "PSI-Registry: Diffie-Hellman & Oblivious PRF Private Set Intersection Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
private-set-intersection-psi = "psi_registry.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/private-set-intersection-psi"
Repository = "https://github.com/abusuraihsakhri/private-set-intersection-psi.git"
