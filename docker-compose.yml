version: '3.8'

services:
  private-set-intersection-psi:
    build: .
    container_name: private-set-intersection-psi
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=private-set-intersection-psi-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
